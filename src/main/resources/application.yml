spring:
  application:
    name: app
  shell:
    interactive:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/poodb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org:
      springframework:
        security: WARN